name: Kavvanah full platforms release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kavvanah-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  website:
    name: Build shared offline website
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: 11.25.0
          runtime: node@22.13.0
          cache: true
          install: false
      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          test -f dist/client/index.html
          test -f dist/client/texts/ashkenaz.json
          test -f dist/client/texts/translations/en.json
          test -f dist/client/texts/translations/ru.json
          test -f dist/client/texts/translations/uk.json
      - name: Share offline-capable website with native build jobs
        uses: actions/upload-artifact@v7
        with:
          name: kavvanah-web-source
          path: dist/client/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  pages:
    name: Deploy GitHub Pages
    needs: website
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: kavvanah-web-source
          path: dist/client
      - name: Adapt site paths for GitHub Pages
        run: node scripts/prepare-pages.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client
      - name: Publish website
        id: deploy
        uses: actions/deploy-pages@v5

  windows:
    name: Windows · portable EXE
    needs: website
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: kavvanah-web-source
          path: dist/client
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
      - name: Synchronize version from VERSION
        run: node scripts/sync-version.mjs
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: npm install --global "@tauri-apps/cli@^2"
      - name: Build directly executable app
        run: tauri build --no-bundle
      - name: Stage Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item 'src-tauri/target/release/kavvanah.exe' 'release/Kavvanah-Windows-x64.exe'
      - uses: actions/upload-artifact@v7
        with:
          name: Kavvanah-package-windows
          path: release/Kavvanah-Windows-x64.exe
          if-no-files-found: error

  linux:
    name: Linux · AppImage
    needs: website
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: kavvanah-web-source
          path: dist/client
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
      - name: Synchronize version from VERSION
        run: node scripts/sync-version.mjs
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: npm install --global "@tauri-apps/cli@^2"
      - name: Build Linux AppImage
        run: tauri build --bundles appimage
      - name: Stage AppImage
        run: |
          mkdir -p release
          set -- src-tauri/target/release/bundle/appimage/*.AppImage
          test "$#" -eq 1 && test -f "$1"
          cp "$1" release/Kavvanah-Linux-x86_64.AppImage
          chmod +x release/Kavvanah-Linux-x86_64.AppImage
      - uses: actions/upload-artifact@v7
        with:
          name: Kavvanah-package-linux
          path: release/Kavvanah-Linux-x86_64.AppImage
          if-no-files-found: error

  macos:
    name: macOS · ${{ matrix.label }} app
    needs: website
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            label: Intel
            suffix: x64
          - runner: macos-15
            target: aarch64-apple-darwin
            label: Apple Silicon
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: kavvanah-web-source
          path: dist/client
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
      - name: Synchronize version from VERSION
        run: node scripts/sync-version.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Tauri CLI
        run: npm install --global "@tauri-apps/cli@^2"
      - name: Generate Apple-compatible icon from bundled artwork
        run: tauri icon public/icons/icon-1024.png --output src-tauri/icons
      - name: Build macOS application
        run: tauri build --bundles app --target "${{ matrix.target }}" --config src-tauri/tauri.macos.conf.json
      - name: Archive app bundle
        shell: bash
        run: |
          mkdir -p release
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Kavvanah.app"
          test -d "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "release/Kavvanah-macOS-${{ matrix.suffix }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: Kavvanah-package-macos-${{ matrix.suffix }}
          path: release/Kavvanah-macOS-${{ matrix.suffix }}.zip
          if-no-files-found: error

  android:
    name: Android · release APK
    needs: website
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: kavvanah-web-source
          path: dist/client
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Synchronize version from VERSION
        run: node scripts/sync-version.mjs
      - name: Verify preinstalled Android SDK
        run: |
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME"
          echo "Using SDK: $ANDROID_HOME"
      - name: Generate and sync native Android project
        working-directory: packaging/android
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npx cap add android
          npx cap sync android
      - name: Apply VERSION to generated Android project
        run: node scripts/sync-version.mjs --android-gradle packaging/android/android/app/build.gradle
      - name: Generate Android launcher artwork
        working-directory: packaging/android
        run: npx capacitor-assets generate --android --iconBackgroundColor "#152443" --splashBackgroundColor "#152443"
      - name: Compile release APK
        working-directory: packaging/android/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Sign and stage release APK
        shell: bash
        run: |
          mkdir -p release
          unsigned="packaging/android/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$unsigned"
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/kavvanah-release.jks" \
            -storepass changeit -keypass changeit -alias kavvanah \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Kavvanah, O=Kavvanah, C=IL"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          zipalign="$(dirname "$apksigner")/zipalign"
          test -x "$zipalign"
          "$zipalign" -p -f 4 "$unsigned" "$RUNNER_TEMP/kavvanah-aligned.apk"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/kavvanah-release.jks" \
            --ks-pass pass:changeit --key-pass pass:changeit \
            --out release/Kavvanah-Android-universal.apk "$RUNNER_TEMP/kavvanah-aligned.apk"
          "$apksigner" verify --verbose release/Kavvanah-Android-universal.apk
      - uses: actions/upload-artifact@v7
        with:
          name: Kavvanah-package-android
          path: release/Kavvanah-Android-universal.apk
          if-no-files-found: error

  release:
    name: Publish versioned release
    needs: [website, pages, windows, linux, macos, android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read release version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "VERSION must use MAJOR.MINOR.PATCH, e.g. 1.0.0" >&2; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
      - name: Download platform packages
        uses: actions/download-artifact@v8
        with:
          pattern: Kavvanah-package-*
          merge-multiple: true
          path: release
      - name: Prepare release notes
        shell: bash
        run: |
          test -n "$(find release -maxdepth 1 -type f -print -quit)"
          cat > release-notes.md <<EOF
          Kavvanah **${VERSION}**, built from commit ${GITHUB_SHA}.

          [Open the website](https://draconov.github.io/Kavvanah-Siddur/) · [Build logs](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})

          - Windows: portable x64 EXE; WebView2 must be available on the system.
          - Linux: x86_64 AppImage; some distributions require FUSE/system libraries.
          - macOS: Intel and Apple Silicon app bundles. They are unsigned and not notarized, so macOS may require manual approval.
          - Android: release-mode universal APK, automatically signed for direct installation. The CI signing key is not a store-distribution key.

          VERSION is the sole release-version source in the repository. Rebuilding the same version replaces the previous GitHub release and assets for that version.
          EOF
      - name: Replace this version's GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete "$TAG" --yes || true
          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force
          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "Kavvanah $VERSION" \
            --notes-file release-notes.md \
            --latest
