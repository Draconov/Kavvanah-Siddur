name: Kavvanah full platforms release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one run publishes for a particular branch at a time.
concurrency:
  group: kavvanah-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  website:
    name: Build shared offline website
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          test -f dist/client/index.html
          test -f dist/client/texts/ashkenaz.json
      - name: Share offline-capable website with native build jobs
        uses: actions/upload-artifact@v4
        with:
          name: kavvanah-web-source
          path: dist/client/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  pages:
    name: Deploy GitHub Pages
    needs: website
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kavvanah-web-source
          path: dist/client
      - name: Adapt site paths for GitHub Pages
        run: node scripts/prepare-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
      - name: Publish website
        id: deploy
        uses: actions/deploy-pages@v4

  windows:
    name: Windows · portable EXE
    needs: website
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kavvanah-web-source
          path: dist/client
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: npm install --global "@tauri-apps/cli@^2"
      - name: Build a directly executable app (no installer)
        run: tauri build --no-bundle
      - name: Stage Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item 'src-tauri/target/release/kavvanah.exe' 'release/Kavvanah-Windows-x64.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: Kavvanah-package-windows
          path: release/Kavvanah-Windows-x64.exe
          if-no-files-found: error

  linux:
    name: Linux · single AppImage
    needs: website
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kavvanah-web-source
          path: dist/client
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: npm install --global "@tauri-apps/cli@^2"
      - name: Build standalone Linux AppImage
        run: tauri build --bundles appimage
      - name: Stage AppImage
        run: |
          mkdir -p release
          set -- src-tauri/target/release/bundle/appimage/*.AppImage
          test "$#" -eq 1 && test -f "$1"
          cp "$1" release/Kavvanah-Linux-x86_64.AppImage
          chmod +x release/Kavvanah-Linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: Kavvanah-package-linux
          path: release/Kavvanah-Linux-x86_64.AppImage
          if-no-files-found: error

  macos:
    name: macOS · ${{ matrix.label }} app
    needs: website
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            label: Intel
            suffix: x64
          - runner: macos-15
            target: aarch64-apple-darwin
            label: Apple Silicon
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kavvanah-web-source
          path: dist/client
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Tauri CLI
        run: npm install --global "@tauri-apps/cli@^2"
      - name: Generate Apple-compatible icon from the bundled Kavvanah artwork
        run: tauri icon public/icons/icon-1024.png --output src-tauri/icons
      - name: Build portable macOS application
        run: tauri build --bundles app --target "${{ matrix.target }}" --config src-tauri/tauri.macos.conf.json
      - name: Archive the single .app bundle (preserve macOS metadata)
        shell: bash
        run: |
          mkdir -p release
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Kavvanah.app"
          test -d "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "release/Kavvanah-macOS-${{ matrix.suffix }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Kavvanah-package-macos-${{ matrix.suffix }}
          path: release/Kavvanah-macOS-${{ matrix.suffix }}.zip
          if-no-files-found: error

  android:
    name: Android · one APK (test-signed)
    needs: website
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kavvanah-web-source
          path: dist/client
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify preinstalled Android SDK
        run: |
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME"
          echo "Using SDK: $ANDROID_HOME"
      - name: Generate and sync native Android project
        working-directory: packaging/android
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npx cap add android
          npx cap sync android
      - name: Generate Android launcher artwork
        working-directory: packaging/android
        run: npx capacitor-assets generate --android --iconBackgroundColor "#152443" --splashBackgroundColor "#152443"
      - name: Compile single installable APK
        working-directory: packaging/android/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Stage testing APK
        run: |
          mkdir -p release
          cp packaging/android/android/app/build/outputs/apk/debug/app-debug.apk release/Kavvanah-Android-universal-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kavvanah-package-android
          path: release/Kavvanah-Android-universal-debug.apk
          if-no-files-found: error

  release:
    name: Publish downloadable development release
    needs: [website, pages, windows, linux, macos, android]
    # Publish completed packages even when one platform fails; the run and
    # release notes explicitly show failures. Never publish an incomplete site.
    if: ${{ always() && needs.website.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Download all completed platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: Kavvanah-package-*
          merge-multiple: true
          path: release
      - name: Prepare release notes and confirm assets
        shell: bash
        env:
          WINDOWS_RESULT: ${{ needs.windows.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          PAGES_RESULT: ${{ needs.pages.result }}
        run: |
          test -d release
          find release -maxdepth 1 -type f -print
          test -n "$(find release -maxdepth 1 -type f -print -quit)"
          cat > release-notes.md <<EOF
          Automated **development build** of commit \`${GITHUB_SHA}\`.

          [Open the website](https://draconov.github.io/Kavvanah-Siddur/) · [View this build's logs](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})

          Platform results: Windows **${WINDOWS_RESULT}** · Linux **${LINUX_RESULT}** · macOS (both architectures) **${MACOS_RESULT}** · Android **${ANDROID_RESULT}** · GitHub Pages **${PAGES_RESULT}**.

          - Windows: directly launch the EXE; WebView2 must be available on the system.
          - Linux: download one AppImage; make it executable before launching. Some distributions require system libraries/FUSE.
          - macOS: unzip to obtain one .app (Intel or Apple Silicon). This build is **unsigned and not notarized** and macOS may block it.
          - Android: the APK is **debug-signed** for testing. Android requires a normal one-time application installation.

          These are test builds, not store releases or signed production packages. If a platform is missing, inspect its job in the linked Actions run.
          EOF
      - name: Create this commit's prerelease with real downloadable assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" release/* \
            --target "$GITHUB_SHA" \
            --title "Kavvanah development build #${GITHUB_RUN_NUMBER}" \
            --notes-file release-notes.md \
            --prerelease --latest=false
