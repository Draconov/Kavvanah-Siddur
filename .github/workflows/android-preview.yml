name: Android APK preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # GitHub's ubuntu-latest runner already has an Android SDK. The old
      # setup-android@v3 step attempted to install a removed SDK package
      # named 'tools', failing before the website or APK build could start.
      - name: Verify Android SDK on runner
        shell: bash
        run: |
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME"
          echo "Android SDK: $ANDROID_HOME"
          java -version
      - name: Build offline-capable website
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          test -f dist/client/index.html
          test -f dist/client/texts/ashkenaz.json
      - name: Generate native Android project
        working-directory: packaging/android
        shell: bash
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npx cap add android
          npx cap sync android
      - name: Generate Android icon
        working-directory: packaging/android
        shell: bash
        run: npx capacitor-assets generate --android --iconBackgroundColor "#152443" --splashBackgroundColor "#152443"
      - name: Compile single installable Android APK
        working-directory: packaging/android/android
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Give test APK a friendly name
        shell: bash
        run: |
          mkdir -p distribution
          cp packaging/android/android/app/build/outputs/apk/debug/app-debug.apk distribution/Kavvanah-Android-universal-debug.apk
      - name: Upload APK (debug-signed, for testing only)
        uses: actions/upload-artifact@v4
        with:
          name: Kavvanah-Android-APK
          path: distribution/Kavvanah-Android-universal-debug.apk
          if-no-files-found: error
