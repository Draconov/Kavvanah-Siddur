name: Windows EXE preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Build offline-capable website
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          test -f dist/client/index.html
          test -f dist/client/texts/ashkenaz.json
      - name: Install Tauri CLI
        run: npm install --global "@tauri-apps/cli@^2"
      # --no-bundle produces a directly launchable EXE, not an NSIS installer.
      - name: Build Windows standalone executable
        run: tauri build --no-bundle
      - name: Rename portable EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path distribution | Out-Null
          Copy-Item 'src-tauri/target/release/kavvanah.exe' 'distribution/Kavvanah-Windows-x64.exe'
      - name: Upload single EXE
        uses: actions/upload-artifact@v4
        with:
          name: Kavvanah-Windows-Portable-EXE
          path: distribution/Kavvanah-Windows-x64.exe
          if-no-files-found: error
